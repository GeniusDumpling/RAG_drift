<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>DJI 文档处理预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182433;font:15px/1.65 system-ui,sans-serif}
header{padding:28px 32px;background:#172333;color:white}header h1{margin:0 0 6px;font-size:26px}
header p{margin:0;color:#c0cedf}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;padding:24px}
aside{align-self:start;position:sticky;top:20px;background:white;border:1px solid #dce2ea}
button{font:inherit;cursor:pointer}aside button{display:block;width:100%;padding:16px;text-align:left;background:white;border:0;border-bottom:1px solid #e4e8ef;color:#182433}
aside button.active{background:#e9f1ff;border-left:4px solid #2468d2}small{display:block;color:#66778b}
main{min-width:0}h2{margin:0 0 8px;font-size:23px}h3{margin:0 0 12px;font-size:17px}
.card{background:white;padding:22px;border:1px solid #dce2ea;margin:0 0 16px}.note{background:#fff4d8;border-left:3px solid #e3ae39;padding:12px;margin:12px 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}input,select{font:inherit;padding:10px;border:1px solid #c9d3e1;background:white;min-width:0}input{flex:1}
.tabs button{padding:9px 16px;background:white;border:1px solid #c9d3e1;color:#245da7}.tabs button.active{background:#2468d2;color:white}
.tabs{display:flex;gap:8px;flex-wrap:wrap}a{color:#2468d2;overflow-wrap:anywhere}.text{white-space:pre-wrap;overflow-wrap:anywhere}
.figure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.figure-grid .card{margin:0}
img{max-width:100%;height:auto}.figure-img{display:block;width:100%;max-height:340px;object-fit:contain;background:#f8fafc}
.page-view{position:relative;max-width:780px;margin:auto}.page-view img{display:block;width:100%}.page-view svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.badge{display:inline-block;padding:2px 8px;background:#eef3ff;color:#335d9a;font-size:12px;margin:0 8px 8px 0}
table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #dce2ea;padding:8px;text-align:left}.stats{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 20px;color:#526578}.muted{color:#66778b}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:16px}aside{position:static}.figure-grid{grid-template-columns:1fr}header{padding:22px 16px}.toolbar{align-items:stretch;flex-direction:column}}
</style><header><h1 id="model-title">DJI 文档处理预览</h1><p>中文正文、原页定位、表格与图示说明 · 原文件保留，图示说明可对照原图核验</p></header>
<div class="layout"><aside id="docs"></aside><main><section class="card"><h2 id="title"></h2><div id="meta"></div><div id="scope"></div>
<div class="toolbar"><input id="search" aria-label="搜索解析内容" placeholder="搜索中文正文或图示说明，如 螺旋桨、返航"><select id="page" aria-label="原 PDF 页码"></select></div>
<div class="tabs"><button data-tab="text">中文内容</button><button data-tab="figures">原图与说明</button><button data-tab="page">页面定位</button><button data-tab="retrieval">检索实验</button><button data-tab="quality">质量与来源差异</button></div></section>
<div id="content"></div></main></div><script>
const data=__DATA__;let doc=data.documents.find(d=>d.document_type==='user_manual')||data.documents[0],tab='text';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.title=data.model_name+' 文档处理预览';$('model-title').textContent=data.model_name+' · 文档处理预览';
const asset=id=>data.assets[id]?.storage_key||'';
function choose(id){doc=data.documents.find(d=>d.id===id);$('search').value='';$('docs').innerHTML=data.documents.map(d=>`<button class="${doc.id===d.id?'active':''}" data-doc="${d.id}">${esc(d.title)}<small>${esc(d.document_type)}</small></button>`).join('');
document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>choose(b.dataset.doc));$('title').textContent=doc.title;
const pages=data.pages.filter(p=>p.processing_id===doc.processing_id&&p.included);
$('meta').innerHTML=`<a href="${esc(asset(doc.source_asset_id))}" target="_blank">原始文件 ↗</a> · <a href="documents/${doc.id}.md">中文 Markdown</a> · <a href="${esc(doc.source_url)}" target="_blank" rel="noreferrer">官方来源 ↗</a><div class="stats"><span>原始 ${doc.metadata_json.total_pages} 页</span><span>保留 ${pages.length} 页</span><span>${data.chunks.filter(c=>c.processing_id===doc.processing_id).length} 个检索片段</span></div>`;
$('scope').innerHTML=doc.scope_note?`<div class="note">${esc(doc.scope_note)}</div>`:'';
$('page').innerHTML='<option value="">全部保留页</option>'+pages.map(p=>`<option value="${p.id}">原 PDF 第 ${p.source_page_no} 页</option>`).join('');
render();}
function chosen(){const q=$('search').value.toLowerCase(),pid=$('page').value;return data.elements.filter(e=>e.processing_id===doc.processing_id&&(!pid||e.regions.some(r=>r.page_id===pid))&&(!q||(e.text+' '+e.section_path+' '+(e.metadata_json.ocr_text||'')+' '+(e.metadata_json.description?.description_zh||'')).toLowerCase().includes(q)));}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render()}});const elements=chosen();
if(tab==='text'){$('content').innerHTML=elements.filter(e=>e.element_type!=='figure').map(e=>`<section class="card"><span class="badge">${esc(e.element_type)}</span><span class="muted">${esc(e.section_path)} ${e.regions.map(r=>'· PDF 第 '+r.source_page_no+' 页').join('')}</span>${e.metadata_json.model_generated?'<div class="note">模型生成的图示说明，请结合原图核验。</div>':''}<div class="text">${esc(e.text)}</div></section>`).join('')||'<section class="card">未找到匹配内容。</section>';}
if(tab==='figures'){const figures=elements.filter(e=>e.element_type==='figure');$('content').innerHTML='<div class="figure-grid">'+figures.map(e=>{const desc=data.elements.find(d=>d.metadata_json.derived_from===e.id);return `<section class="card"><a href="${esc(asset(e.asset_id))}" target="_blank"><img class="figure-img" src="${esc(asset(e.asset_id))}" alt="原始文档图示"></a><p class="muted">原 PDF 第 ${e.regions[0].source_page_no} 页 · ${esc(e.metadata_json.description?.image_type||'图示')}</p><div class="text">${esc(e.metadata_json.quality_gate?.status==='quarantined'?'说明未通过质量检查，已隔离；原图继续保留。':desc?.text||e.metadata_json.description?.description_zh||'描述尚未生成')}</div><small>说明为模型生成；原图和页码为核验依据。检查：${esc(e.metadata_json.quality_gate?.verification||'历史说明，未经新检查')}</small></section>`}).join('')+'</div>';}
if(tab==='page'){const page=data.pages.find(p=>p.processing_id===doc.processing_id&&p.included&&p.id===$('page').value)||data.pages.find(p=>p.processing_id===doc.processing_id&&p.included);if(!page){$('content').innerHTML='<section class="card">此文档没有保留的 PDF 页面；技术参数 HTML 可在中文内容中查看。</section>';return;}
const regions=data.elements.filter(e=>e.processing_id===doc.processing_id&&e.element_type!=='figure').flatMap(e=>e.regions.filter(r=>r.page_id===page.id));
$('content').innerHTML=`<section class="card"><h3>原 PDF 第 ${page.source_page_no} 页 · 蓝框为保留内容的位置</h3><a href="${esc(asset(doc.source_asset_id))}#page=${page.source_page_no}" target="_blank">打开原 PDF 对应页 ↗</a><div class="page-view"><img src="${esc(asset(page.render_asset_id))}" alt="原始页面"><svg viewBox="0 0 ${page.width} ${page.height}">${regions.map(r=>`<rect x="${r.bbox[0]}" y="${r.bbox[1]}" width="${r.bbox[2]-r.bbox[0]}" height="${r.bbox[3]-r.bbox[1]}" fill="#2468d2" fill-opacity=".05" stroke="#2468d2" stroke-width=".5"/>`).join('')}</svg></div></section>`;}
if(tab==='quality'){const audit=data.caption_audit,diffs=data.source_differences||[],tables=data.elements.filter(e=>e.metadata_json.table_kind==='led_battery_states');
$('content').innerHTML=(audit?`<section class="card"><h3>图片描述质量检查</h3><p>通过 ${audit.accepted} 张；隔离 ${audit.quarantined} 张；额外视觉核验 ${audit.vision_reviewed} 张。</p><p>隔离说明不进入索引，原图保留。结构检查及模型复核不能保证完全消除幻觉。</p><a href="caption-quality-report.json">查看检查明细</a></section>`:'')+tables.map(e=>`<section class="card"><h3>原 PDF 第 ${e.regions[0].source_page_no} 页 · 图形符号恢复</h3><p>依据原文图例与矢量形状识别常亮、闪烁、熄灭，保留逐单元格坐标。</p><a href="${esc(asset(e.asset_id))}" target="_blank"><img class="figure-img" src="${esc(asset(e.asset_id))}" alt="原始灯态表"></a><table>${e.table_json.rows.map((row,i)=>'<tr>'+row.map(v=>`<${i?'td':'th'}>${esc(v)}</${i?'td':'th'}>`).join('')+'</tr>').join('')}</table></section>`).join('')+diffs.map(d=>`<section class="card"><h3>参数来源差异 · ${esc(({max_flight_time:'最长飞行时间',max_hover_time:'最长悬停时间',takeoff_weight:'起飞重量'})[d.parameter_key]||d.parameter_key)}</h3><p class="note">${esc(d.note)} 状态：${esc(d.status==='unresolved'?'尚未核实':d.status)}</p>${d.claims.map(c=>`<p><strong>${esc(c.source.title)}</strong> · 版本 ${esc(c.source.official_version||'未标注')} · ${esc(c.source.source_pages.length?'原 PDF 第 '+c.source.source_pages.join(', ')+' 页':'技术参数 HTML')}</p><div class="text">${esc(c.conditions.original_text)}</div>`).join('<hr>')}</section>`).join('');
if(!$('content').innerHTML)$('content').innerHTML='<section class="card">此数据包尚无新的质量检查记录。</section>';}
if(tab==='retrieval'){$('content').innerHTML=data.retrieval?data.retrieval.queries.map(q=>`<section class="card"><h3>${esc(q.question)}</h3>${q.answer_zh?`<div class="note">${q.answer_is_model_generated===false?'原文/结构化证据回退':'图文问答演示'} · ${q.answer_is_model_generated===false?'可核验来源记录':q.images_sent+' 张原图参与生成'}</div><div class="text">${esc(q.answer_zh)}</div><p>关键条件与引用核验：${esc(({passed:'模型输出检查通过',source_verified:'原文/结构化记录已核对',needs_review:'需要人工复核'})[q.answer_verification?.status]||'历史试点，未经新检查')} · ${q.answer_verification?.history.length||0} 次生成/修订</p><hr>`:''}${q.evidence.map((e,i)=>`<p><strong>[${i+1}] ${esc(e.title)}</strong> · PDF ${esc(e.source_pages.join(', '))} · ${e.score.toFixed(3)}</p><div class="text">${esc(e.text)}</div>`).join('<hr>')}</section>`).join(''):'<section class="card">完成入库与检索验证后生成此页。</section>';}}
$('search').oninput=render;$('page').onchange=render;choose(doc.id);
</script></html>
