# YouTube 视频采集参数配置
# 约定：非敏感参数全部放本文件；API Key 等敏感值统一从仓库根目录 .env（全局）读取。

search:
  queries:
    - query: "DJI drone"
      language: en
    - query: "drone MAVLink telemetry security vulnerability"
      language: en
    - query: "drone flight controller firmware hardware test"
      language: en
    - query: "drone lost signal flyaway GPS failure"
      language: en
    - query: "drone remote controller signal hijacking security"
      language: en
    - query: "drone teardown antenna debug port hardware"
      language: en
    - query: "大疆无人机"
      language: zh
    - query: "无人机 GPS 欺骗 干扰 演示"
      language: zh
    - query: "无人机 MAVLink 遥测 通信 安全"
      language: zh
    - query: "无人机 飞控 固件 硬件 拆解"
      language: zh
    - query: "无人机 失联 炸机 GPS 丢失 故障"
      language: zh
  state_path: search-state.json     # 持久化下一条查询索引；每次定时任务轮换，非时间桶
  max_results: 25                   # 每页候选数（1-50）
  max_pages: 3                      # 当前查询最多翻页数；耗尽或达到 success_target 时停止
  success_target: 1                 # 每个定时 tick 成功入库的视频数
  caption_only: true                # 只搜带字幕的视频
  order: date                       # 优先新内容，降低固定 relevance 排名的重复率
  language: en                      # 全局默认字幕语言（仅对未指定 language 的条目生效）
  whisper_fallback: true            # 无可用公开字幕轨时使用本地 Whisper 转写

download:
  proxy: ""                       # 默认直连；部署时通过 HTTPS_PROXY / HTTP_PROXY 配置
  keyframes_dir: downloads          # 关键帧保存根目录（相对本文件所在目录）

whisper:
  model: small                      # faster-whisper 模型（small | base | medium 等）
  device: auto                      # auto | cuda | cpu
  model_cache: model-cache/whisper  # 模型缓存目录（相对仓库根目录）

retry:
  attempts: 2                       # 单个候选入库失败重试次数
  delay_seconds: 3.0                # 重试间隔（秒）
