# Both native pipelines publish into this instance through the shared graph layer.
name: rag-unified-graph

services:
  neo4j-unified:
    image: neo4j:5.26-community
    container_name: intelligence-rag-neo4j-unified
    environment:
      NEO4J_AUTH: neo4j/${UNIFIED_GRAPH_NEO4J_PASSWORD:?Set UNIFIED_GRAPH_NEO4J_PASSWORD in .env.unified-graph}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7477:7474"
      - "127.0.0.1:7690:7687"
    volumes:
      - unified-graph-data:/data
      - unified-graph-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  unified-graph-data:
  unified-graph-logs:
